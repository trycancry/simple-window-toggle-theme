name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to build and upload, for example v1.1.0. Leave blank for a dev build.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $manualTag = "${{ github.event.inputs.release_tag }}"

          if ($refType -eq "tag") {
            $releaseTag = $refName
          }
          elseif (-not [string]::IsNullOrWhiteSpace($manualTag)) {
            $releaseTag = $manualTag.Trim()
          }
          else {
            $releaseTag = ""
          }

          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            $exeName = "ToggleTheme-$releaseTag.exe"
            $artifactName = "ToggleTheme-$releaseTag-windows-x64"
            $versionString = $releaseTag.TrimStart('v')

            if ($releaseTag -match '^v(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') {
              $fileVersion = "$($Matches[1]),$($Matches[2]),$($Matches[3]),0"
            }
            else {
              $fileVersion = "0,0,0,0"
            }

            $isRelease = "true"
          }
          else {
            $exeName = "ToggleTheme-dev.exe"
            $artifactName = "ToggleTheme-dev-windows-x64"
            $versionString = "0.0.0-dev"
            $fileVersion = "0,0,0,0"
            $isRelease = "false"
          }

          @"
          #pragma once
          #define APP_FILE_VERSION $fileVersion
          #define APP_FILE_VERSION_STRING "$versionString"
          "@ | Set-Content -Path version.h -Encoding ascii

          "EXE_NAME=$exeName" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "IS_RELEASE=$isRelease" >> $env:GITHUB_ENV

      - name: Build Release x64
        shell: pwsh
        run: msbuild main.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'x64\\Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Built EXE not found under x64\Release' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName "artifact\${{ env.EXE_NAME }}"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/${{ env.EXE_NAME }}
          if-no-files-found: error

      - name: Publish EXE to GitHub Release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $asset = "artifact/${{ env.EXE_NAME }}"
          $repo = "${{ github.repository }}"

          if (gh release view "$tag" --repo "$repo" *> $null) {
            gh release upload "$tag" "$asset" --clobber --repo "$repo"
          }
          else {
            gh release create "$tag" "$asset" --title "$tag" --generate-notes --repo "$repo"
          }
