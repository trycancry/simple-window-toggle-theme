name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: msbuild main.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'x64\\Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Built EXE not found under x64\Release' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName artifact\ToggleTheme.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToggleTheme-windows-x64
          path: artifact/ToggleTheme.exe
          if-no-files-found: error

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifact/ToggleTheme.exe --title "${{ github.ref_name }}" --generate-notes

      - name: Publish v1.0.0
        if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 artifact/ToggleTheme.exe --title "v1.0.0" --generate-notes --target "${{ github.sha }}"
